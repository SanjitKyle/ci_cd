name: Exercise 6 - The Matrix Strategy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  matrix_test:
    runs-on: ubuntu-latest
    
    # Here is the magic Matrix block!
    strategy:
      matrix:
        node-version: [16, 18, 20]
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Notice how we use the matrix variable here:
      - name: Setup Node.js version ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests for this version
        run: |
          echo "Testing backend code on Node.js version ${{ matrix.node-version }}"
          echo "✅ All tests passed!"
