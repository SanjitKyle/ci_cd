name: Real Node.js Deploy

on:
  push:
    branches:
      - main

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:                                     # ✅ indented under build_job
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Zip the code
        run: zip -r mybackend.zip . -x "*.git*"  # ✅ correct exclude pattern

      - name: Upload the artifact
        uses: actions/upload-artifact@v4         # ✅ no 's'
        with:
          name: backend-package
          path: mybackend.zip

  deploy_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package

      - name: Deploy to AWS
        run: |
          echo "Successfully deployed to AWS!"