name: Exercise 8 - Caching Magic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cache_test_job:
    runs-on: ubuntu-latest
    steps:
      
      # Step 1: Tell GitHub to look for a saved folder in the cache
      - name: Try to load Cache
        uses: actions/cache@v4
        id: my-cache                 # Give this step an ID so we can reference it later
        with:
          path: my-heavy-folder      # The folder we want to save/load
          key: my-cache-key-v1       # The unique password/key for this cache

      # Step 2: Only run this heavy step if the cache WAS NOT found
      - name: Simulate heavy downloading (Cache Miss)
        if: steps.my-cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache not found! Pretending to download 500MB of data for 10 seconds..."
          sleep 10
          mkdir my-heavy-folder
          echo "Massive downloaded data!" > my-heavy-folder/data.txt
          echo "Done downloading."

      # Step 3: Verify the data is there
      - name: Verify data exists
        run: |
          echo "Checking inside the folder:"
          cat my-heavy-folder/data.txt
