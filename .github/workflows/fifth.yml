name: Exercise 5 - Multi-Job Pipelines

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: Testing the code
  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout code
        uses: actions/checkout@v4
        
      - name: Step 2 - Run tests
        run: |
          echo "Running tests..."
          echo "Tests passed! ✅"

  # Job 2: Deploying the code
  deploy_job:
    runs-on: ubuntu-latest
    needs: test_job  # <--- THIS IS THE MAGIC WORD!
    steps:
      - name: Step 1 - Deploy to production
        run: |
          echo "Deploying application to the server... 🚀"
