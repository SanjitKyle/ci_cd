name: exercise quality gate 
on:
 push:
  branches:
   - main :
 workflow_dispatch:

jobs:
 run_quaity_test:
  runs-on: ubuntu-latest
 steps:
   - name: step 2 - checkout repository
     uses: actions/checkout@v4
   - name : step 2 - setup node js 
     uses: actions/setup-node@v4
     with:
       node-version: 20 
   - name : step 3 - install dependency 
     run: npm ci
   - name : step4 - Execute the unit test 
     run : npm test 
    
    