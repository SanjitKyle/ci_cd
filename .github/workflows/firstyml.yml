name: My First Workflow

on:
  push:
  workflow_dispatch:

jobs:
  check-my-code:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Download my code
        uses: actions/checkout@v4

      - name: 2. Check Node version
        run: node -v

      - name: 3. Print a success message
        run: echo "Hello! My CI pipeline ran successfully!"