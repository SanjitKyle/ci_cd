name: week 1 Triggers & Filtters 

on:
 # Trigger on push  , but only on main branch 
  push:
    branches:
      - main 
    path-ignore:
      - "README.md"
  pull_request:
    branches:
      - main 
    
  # Trigger manual trigger from github action tab 
  workflow_dispatch:

jobs:
  test_trigger:
    runs-on: ubuntu-latest
    steps:
     - name: 1. checkout code 
       uses: actions/checkout@v4
     - name: 2. print success message
       run: |
         echo "Hello its is working sucessfully "
