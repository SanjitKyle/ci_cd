name : Exercise 2 - Trigger and filters
on:
 push:
  branches:
   - main 

  path-ignores:
   - "**md"

  workflow_dispatch:


jobs:
 filter_test_job:
   runs-on: ubuntu-latest 

   steps: 
    - name : Step 1 - check the repo 
      uses: actions/checkout@v4
    - name : Step 2- Print Trigger Info 
      run: |
       echo "branch triggered :${{github.ref_name}}"
       echo "Event type ${{github.event_name}}"
