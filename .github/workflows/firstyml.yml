name: 🚀 Class 2 - Live Deployment Control Center

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # 🎛️ Interactive UI Inputs
    inputs:
      target_env:
        description: '🎯 Select Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      deployer_name:
        description: '✍️ Enter Your Name / Lead'
        required: true
        default: 'Sanjit'
        type: string

jobs:
  release_control:
    name: ⚡ Release & Deploy Engine
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Run Automated Tests
        run: npm test

      # 🎨 GENERATES A LIVE VISUAL DASHBOARD ON GITHUB!
      - name: 5. Generate Live Summary Card
        run: |
          echo "## 🚀 Deployment Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 **DevOps Engineer** | ${{ inputs.deployer_name || github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 **Target Environment** | \`${{ inputs.target_env || 'auto-push' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 **Git Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📌 **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **Test Suite** | ✅ PASSED (100%) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Security Status** | ✅ Secrets Protected |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **Status** | **SUCCESSFULLY VERIFIED** |" >> $GITHUB_STEP_SUMMARY