name:  Automated Quality Gate 

on:
 # Trigger on push  , but only on main branch 
  push:
    branches:
      - main 
    path-ignore:
      - "README.md"
  pull_request:
    branches:
      - main 
    
  # Trigger manual trigger from github action tab 
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
     - name: 1. checkout repository 
       uses: actions/checkout@v4
     - name: 2. setup nodejs 
       uses: actions/setup-node@v3
       with:
         node-version: 20
     - name : 3. Install package
       run : npm ci
     - name : 4. Execute test script 
       run : npm test 

