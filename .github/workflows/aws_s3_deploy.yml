name: Deploy Backend to AWS S3 via OIDC

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 🔑 CRITICAL: Gives GitHub Actions permission to generate temporary AWS OIDC tokens
permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js with Caching
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Quality Gate)
        run: npm test

      - name: Package Application into ZIP
        run: zip -r backend.zip . -x "*.git*"

      # 🔍 DEBUG: Inspect OIDC Token claims
      - name: Inspect GitHub OIDC Token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Token payload:"
          echo $TOKEN | jq -R 'split(".") | .[1] | @base64d | fromjson | {iss, aud, sub, repository, repository_owner, ref}'

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::194722438900:role/GitHubActions-S3-DeployRole
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      # 🚀 Upload package directly to your AWS S3 Bucket
      - name: Upload backend.zip to Amazon S3
        run: |
          aws s3 cp backend.zip s3://sanjit-backend-builds/
          echo "Successfully uploaded backend.zip to AWS S3! 🚀"